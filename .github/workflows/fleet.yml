name: fleet

# Re-tests the tracked MCP servers on fresh GitHub-hosted machines and publishes the new grades.
# Every 6 hours, and by hand from the Actions tab. Each server runs in its own job with NO secrets and a
# read-only token (they are third-party packages); only the collect job may push, only the deploy
# job sees the Cloudflare token. fleet/plan.mjs picks the jobs, fleet/merge.mjs folds the reports in.
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      force_all:
        description: 'Re-test every tracked server, not only new versions and stale results'
        type: boolean
        default: false
      max_new:
        description: 'New servers to add per run (below 360 tracked, at least 60 are tried regardless)'
        default: '10'
      file_owner_issues:
        description: 'File one hand-approved batch of owner issues (the top of fleet/owner-issues-draft.md; needs OWNER_ISSUES_TOKEN)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: fleet
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - id: plan
        env:
          FORCE_ALL: ${{ github.event.inputs.force_all == 'true' && '1' || '' }}
          MAX_NEW: ${{ github.event.inputs.max_new || '10' }}
          FLEET_EXCLUDE: ${{ secrets.FLEET_EXCLUDE }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node fleet/plan.mjs

  test:
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - name: run Sealmark
        env:
          META: ${{ toJSON(matrix) }}
          LAUNCH: ${{ matrix.launch }}
        run: |
          mkdir -p out
          printf '%s' "$META" > out/meta.json
          T0=$(date +%s)
          set +e
          timeout 420 npx -y sealmark@latest run --start "$LAUNCH" --format json --out out/sealmark.json --fail-under none
          RC=$?
          set -e
          # timing and exit code feed fleet/telemetry.jsonl (no server output is kept here)
          printf '{"durationS":%s,"exitCode":%s}' "$(( $(date +%s) - T0 ))" "$RC" > out/run.json
          exit 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: report-${{ matrix.id }}
          path: out/
          retention-days: 14

  collect:
    needs: [plan, test]
    if: always() && needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: report-*
          path: reports
      - run: node fleet/merge.mjs reports
      - name: triage and trends (feedback loop into Sealmark)
        run: |
          node fleet/triage.mjs
          node fleet/trends.mjs
          { cat fleet/triage-summary.md; echo; cat fleet/trends-summary.md; } >> "$GITHUB_STEP_SUMMARY"
      - name: file Sealmark issues (needs SEALMARK_ISSUES_TOKEN; otherwise Maya files them from triage.json)
        env:
          GH_TOKEN: ${{ secrets.SEALMARK_ISSUES_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "SEALMARK_ISSUES_TOKEN not set: triage.json is committed, issues are filed by hq-builder."; exit 0; fi
          node fleet/file-issues.mjs
      # Posted by the bot account (OWNER_ISSUES_TOKEN), never a personal one. Live when the OWNER_ISSUES_LIVE variable
      # is "1", or for one run started by hand with file_owner_issues ticked (how the first batches are approved).
      # Security findings are never posted: those repositories are held in a gitignored private queue (count only in
      # the log). MAX_OWNER_ISSUES caps issues per run; 2 until the variable is set (8 once the first runs read well).
      - name: tell server owners (one issue per repo; drafts only unless OWNER_ISSUES_TOKEN and OWNER_ISSUES_LIVE == "1")
        env:
          OWNER_ISSUES_TOKEN: ${{ secrets.OWNER_ISSUES_TOKEN }}
          OWNER_ISSUES_LIVE: ${{ (vars.OWNER_ISSUES_LIVE == '1' || github.event.inputs.file_owner_issues == 'true') && '1' || '' }}
          MAX_OWNER_ISSUES: ${{ vars.MAX_OWNER_ISSUES || '2' }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node fleet/notify-owners.mjs
      - name: impact of owner notices (internal; reads GitHub and the notify D1, writes fleet/impact-summary.md)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node fleet/impact.mjs
      - name: commit the new grades
        run: |
          git config user.name "Jordan Lewis"
          git config user.email "42820601+jordanallenlewis@users.noreply.github.com"
          git add web/content/data/server-results.json web/content/data/trends.json fleet/
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "fleet: automated re-test results $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push origin HEAD:main

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: f37b212eac72fedf8ef688eb7856ea4d
    steps:
      - name: need the Cloudflare token
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "::warning::CLOUDFLARE_API_TOKEN is not set; grades were committed but the site was not deployed."; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          node-version: '24'
      - name: build and deploy the website
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          cd web && npm ci && npm run build && npx -y wrangler deploy
